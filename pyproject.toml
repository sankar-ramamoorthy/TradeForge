[project]
name = "tradeforge"
version = "0.1.0"
description = "Event-sourced, persona-driven decision lifecycle runtime for trading workflows."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "alembic>=1.17",
    "alpaca-py>=0.30",
    "cryptography>=45.0",
    "fastapi[standard]>=0.124",
    "polygon-api-client>=1.0",
    "psycopg[binary]>=3.2",
    "yfinance>=1.3.0",
]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.0",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true

[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*", "pandas", "pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["alpaca", "alpaca.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["polygon", "polygon.*"]
ignore_missing_imports = true
