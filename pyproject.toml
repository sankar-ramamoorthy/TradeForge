[project]
name = "tradeforge"
version = "0.1.0"
description = "Event-sourced, persona-driven decision lifecycle runtime for trading workflows."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
