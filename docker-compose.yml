services:
  tradeforge:
    image: tradeforge-runtime:local
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      TRADEFORGE_DATABASE_URL: postgresql://tradeforge:tradeforge@postgres:5432/tradeforge
      TRADEFORGE_MASTER_KEY: ${TRADEFORGE_MASTER_KEY:-}
      TRADEFORGE_RUNTIME_ENV_FILE: /app/.tradeforge/runtime.env
    volumes:
      - ./.tradeforge:/app/.tradeforge
      - ./imports/incoming:/app/imports/incoming:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
        required: false
    restart: unless-stopped

  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: tradeforge
      POSTGRES_USER: tradeforge
      POSTGRES_PASSWORD: tradeforge
    ports:
      - "5432:5432"
    volumes:
      - tradeforge-postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeforge -d tradeforge"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  litellm:
    image: docker.litellm.ai/berriai/litellm:v1.72.6-stable
    profiles:
      - advisory
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-tradeforge-local-dev}
    expose:
      - "4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request,os;
          urllib.request.urlopen(urllib.request.Request(
          'http://localhost:4000/health/readiness',
          headers={'Authorization':'Bearer '+os.environ['LITELLM_MASTER_KEY']}))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    command:
      [
        "--config", "/app/config.yaml",
        "--host", "0.0.0.0",
        "--port", "4000"
      ]

volumes:
  tradeforge-postgres-data:
