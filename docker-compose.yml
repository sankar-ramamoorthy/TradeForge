services:
  tradeforge:
    image: tradeforge-runtime:local
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      TRADEFORGE_DATABASE_URL: postgresql://tradeforge:tradeforge@postgres:5432/tradeforge
      TRADEFORGE_MASTER_KEY: ${TRADEFORGE_MASTER_KEY:?TRADEFORGE_MASTER_KEY must be set in the host environment}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - tradeforge-venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command:
      [
        "uv", "run", "uvicorn",
        "src.app.api.application:app",
        "--host", "0.0.0.0",
        "--port", "8000"
      ]

  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: tradeforge
      POSTGRES_USER: tradeforge
      POSTGRES_PASSWORD: tradeforge
    ports:
      - "5432:5432"
    volumes:
      - tradeforge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeforge -d tradeforge"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  litellm:
    image: docker.litellm.ai/berriai/litellm:main-latest
    profiles:
      - advisory
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-tradeforge-local-dev}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY:-}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    command:
      [
        "--config", "/app/config.yaml",
        "--host", "0.0.0.0",
        "--port", "4000"
      ]

volumes:
  tradeforge-venv:
  tradeforge-postgres-data:
